name: AQI Prediction Pipeline
"on":
  schedule:
    - cron: "0 * * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Which pipeline to run"
        required: true
        default: "feature"
        type: choice
        options:
          - feature
          - training
          - backfill
      backfill_days:
        description: "Days to backfill (backfill pipeline only)"
        required: false
        default: "90"
jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display inputs
        run: |
          echo "Pipeline: ${{ github.event.inputs.pipeline }}"
          echo "Backfill Days: ${{ github.event.inputs.backfill_days }}"
