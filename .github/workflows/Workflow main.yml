name: AQI Prediction Pipeline
"on":
  schedule:
    - cron: "0 * * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Which pipeline to run"
        required: true
        default: "feature"
        type: choice
        options:
          - feature
          - training
          - backfill
      backfill_days:
        description: "Days to backfill (backfill pipeline only)"
        required: false
        default: "90"
