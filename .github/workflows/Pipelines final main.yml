name: AQI Prediction Pipeline

on:
  # Feature pipeline: every hour
  schedule:
    - cron: "0 * * * *"         # Feature pipeline — top of every hour
    - cron: "0 2 * * *"         # Training pipeline — 02:00 UTC daily

  # Manual trigger (useful for backfill, debugging)
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Which pipeline to run"
        required: true
        default: "feature"
        type: choice
        options:
          - feature
          - training
          - backfill
      backfill_days:
        description: "Days to backfill (backfill pipeline only)"
        required: false
        default: "90"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Feature pipeline (runs every hour + on manual trigger)
  # ─────────────────────────────────────────────────────────────────────────
  feature-pipeline:
    name: "Feature Pipeline (hourly)"
    runs-on: ubuntu-latest
    # Run when: scheduled at top of hour, or manually selecting 'feature'
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'feature'
      || (github.event_name == 'schedule' && contains(github.event.schedule, '0 * * * *'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          AQICN_TOKEN:          ${{ secrets.AQICN_TOKEN }}
          OPENWEATHER_API_KEY:  ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY:    ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT:    ${{ secrets.HOPSWORKS_PROJECT }}
          TARGET_CITY:          ${{ vars.TARGET_CITY }}
          CITY_LAT:             ${{ vars.CITY_LAT }}
          CITY_LON:             ${{ vars.CITY_LON }}
          DATA_DIR:             ./data
        run: python pipelines/feature_pipeline.py

      - name: Upload feature artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: features-${{ github.run_number }}
          path: |
            data/features.csv
            logs/feature_pipeline.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Training pipeline (runs at 02:00 UTC + on manual trigger)
  # ─────────────────────────────────────────────────────────────────────────
  training-pipeline:
    name: "Training Pipeline (daily)"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'training'
      || (github.event_name == 'schedule' && contains(github.event.schedule, '0 2 * * *'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training pipeline
        env:
          HOPSWORKS_API_KEY:  ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT:  ${{ secrets.HOPSWORKS_PROJECT }}
          TARGET_CITY:        ${{ vars.TARGET_CITY }}
          DATA_DIR:           ./data
          MODELS_DIR:         ./saved_models
        run: python pipelines/training_pipeline.py

      - name: Upload model artefacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: model-${{ github.run_number }}
          path: |
            saved_models/
            logs/training_pipeline.log
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Backfill pipeline (manual only)
  # ─────────────────────────────────────────────────────────────────────────
  backfill-pipeline:
    name: "Backfill Pipeline (manual)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'backfill'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backfill pipeline
        env:
          AQICN_TOKEN:          ${{ secrets.AQICN_TOKEN }}
          OPENWEATHER_API_KEY:  ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY:    ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT:    ${{ secrets.HOPSWORKS_PROJECT }}
          TARGET_CITY:          ${{ vars.TARGET_CITY }}
          CITY_LAT:             ${{ vars.CITY_LAT }}
          CITY_LON:             ${{ vars.CITY_LON }}
          DATA_DIR:             ./data
          BACKFILL_DAYS:        ${{ github.event.inputs.backfill_days }}
        run: python pipelines/backfill_pipeline.py --days ${{ github.event.inputs.backfill_days }}

      - name: Upload backfill artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backfill-${{ github.run_number }}
          path: |
            data/features.csv
            logs/backfill_pipeline.log
          retention-days: 14
